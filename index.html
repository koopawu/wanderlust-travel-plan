    // ========== HOOKS ==========
    function useReveal() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            el.classList.add('visible');
            observer.unobserve(el);
          }
        }, { threshold: 0.15 });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);
      return ref;
    }

                  <p className="text-text-secondary leading-relaxed">5个冬季目的地均匀分布在5年，每年仅1次冬季旅行。夏季目的地分散在不同年份，春秋季平衡填充。</p>
                </div>
                <div>
                  <h5 className="text-accent-purple font-medium mb-2">体力曲线</h5>
                  <p className="text-text-secondary leading-relaxed">30-31岁以中高强度为主（樱花暴走、峡湾徒步），32-33岁达到巅峰（滑雪、极光追逐），34岁转向文化深度游。</p>
                </div>
                <div>

                  <p className="text-text-secondary leading-relaxed">第1年建立日韩加签证记录，第2年申根+英签，第3年申根续签，第4年挑战美签，第5年申根覆盖两国。</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- Budget Chart ---
    function BudgetChart() {
      const ref = useReveal();
      const sorted = [...destinations].sort((a, b) => b.budget.totalMax - a.budget.totalMax);
      const maxBudget = sorted[0]?.budget.totalMax || 40000;

      const totalMin = destinations.reduce((s, d) => s + d.budget.totalMin, 0);
      const totalMax = destinations.reduce((s, d) => s + d.budget.totalMax, 0);
      const totalDays = destinations.reduce((s, d) => s + d.durationDays, 0);

      return (
        <section className="py-20 md:py-28">
          <div ref={ref} className="reveal text-center mb-16 max-w-6xl mx-auto px-4">
            <span className="text-accent-purple text-sm tracking-[0.2em] uppercase">Budget</span>
            <h2 className="text-3xl md:text-5xl font-bold mt-2 mb-4" style={{ fontFamily: 'var(--font-display)' }}>
              预算<span className="gradient-text">对比</span>
            </h2>
            <p className="text-text-secondary max-w-xl mx-auto">
              12个目的地的预算一览，合理规划每一次出发
            </p>
          </div>

          <div className="max-w-4xl mx-auto px-4">
            <div className="space-y-4">
              {sorted.map((dest, index) => {
                const barWidth = (dest.budget.totalMax / maxBudget) * 100;
                return (
                  <div key={dest.id} className="reveal flex items-center gap-3 md:gap-4" style={{ transitionDelay: `${index * 0.06}s` }}>
                    <div className="w-24 md:w-32 text-right flex-shrink-0">
                      <span className="text-sm font-medium text-text-primary">{dest.name}</span>
                    </div>
                    <div className="flex-1 relative h-10 bg-bg-card rounded-lg overflow-hidden border border-border hover:border-border-light transition-colors">
                      <div className="absolute top-1/2 -translate-y-1/2 h-6 rounded-md bg-gradient-to-r from-accent-cyan/60 to-accent-purple/60 bar-grow" style={{ '--bar-width': `${barWidth}%` }} />
                      <div className="absolute inset-0 flex items-center px-3">
                        <span className="text-xs font-medium text-text-primary drop-shadow-md">¥{(dest.budget.totalMin / 10000).toFixed(1)}-{(dest.budget.totalMax / 10000).toFixed(1)}万</span>
                      </div>
                    </div>
                    <div className="w-12 text-center flex-shrink-0">
                      <span className="text-xs text-text-muted">{dest.durationDays}天</span>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Legend */}
            <div ref={ref} className="reveal flex flex-wrap justify-center gap-4 mt-10">
              {[
                { label: '往返机票', color: '#22d3ee' },
                { label: '住宿', color: '#a78bfa' },
                { label: '餐饮', color: '#fb923c' },
                { label: '当地交通', color: '#34d399' },
                { label: '活动', color: '#f472b6' },
              ].map(item => (
                <div key={item.label} className="flex items-center gap-2 text-sm text-text-secondary">
                  <div className="w-3 h-3 rounded-full" style={{ backgroundColor: item.color }} />
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Summary Cards */}
          <div className="max-w-5xl mx-auto px-4 mt-16">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {[
                { label: '最低总预算', value: `¥${(totalMin / 10000).toFixed(1)}万`, color: 'text-accent-cyan', desc: '经济出行' },
                { label: '最高总预算', value: `¥${(totalMax / 10000).toFixed(1)}万`, color: 'text-accent-purple', desc: '舒适出行' },
                { label: '总计天数', value: `${totalDays}天`, color: 'text-accent-green', desc: '12段旅程' },
                { label: '最省目的地', value: '首尔雪夜', color: 'text-accent-orange', desc: '¥0.75-1.3万' },
              ].map((item, i) => (
                <div key={item.label} className="reveal bg-bg-card rounded-xl p-5 border border-border text-center" style={{ transitionDelay: `${i * 0.08}s` }}>
                  <div className="text-xs text-text-muted mb-1">{item.label}</div>
                  <div className={`text-xl md:text-2xl font-bold ${item.color} mb-1`}>{item.value}</div>
                  <div className="text-xs text-text-muted">{item.desc}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // --- CTA Section ---
    function CTASection() {
      return (
        <section className="py-20 md:py-28 relative overflow-hidden">
          <div className="absolute inset-0 opacity-30">
            <img src={TRAVEL_IMAGES[14]} alt="" className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-b from-bg-primary via-bg-primary/90 to-bg-primary" />

          <div className="reveal relative z-10 max-w-3xl mx-auto px-4 text-center">
            <h2 className="text-3xl md:text-5xl font-bold mb-4" style={{ fontFamily: 'var(--font-display)' }}>
              开始你的<span className="gradient-text">旅程</span>
            </h2>
            <p className="text-text-secondary mb-8 max-w-xl mx-auto">
              人生不过数十载，而世界如此辽阔。用5年时间，完成12个梦想，让每一次出发都成为值得珍藏一生的回忆。
            </p>
            <div className="flex flex-wrap justify-center gap-4 text-sm text-text-muted">
              <span className="flex items-center gap-1.5">
                <svg className="w-4 h-4 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                12个目的地
              </span>
              <span className="w-1 h-1 rounded-full bg-text-muted" />
              <span className="flex items-center gap-1.5">
                <svg className="w-4 h-4 text-accent-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /></svg>
                5年规划
              </span>
              <span className="w-1 h-1 rounded-full bg-text-muted" />
              <span className="flex items-center gap-1.5">
                <svg className="w-4 h-4 text-accent-pink" fill="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                一生回忆
              </span>
            </div>
          </div>
        </section>
      );
    }

    // --- Footer ---
    function Footer() {
      const totalMin = destinations.reduce((s, d) => s + d.budget.totalMin, 0);
      const totalMax = destinations.reduce((s, d) => s + d.budget.totalMax, 0);
      const totalDays = destinations.reduce((s, d) => s + d.durationDays, 0);

      return (
        <footer className="py-16 border-t border-border">
          <div className="max-w-6xl mx-auto px-4">
            <div className="text-center">
              <div className="flex items-center justify-center gap-2 mb-4">
                <svg className="w-6 h-6 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span className="text-2xl font-bold gradient-text" style={{ fontFamily: 'var(--font-display)' }}>Wanderlust</span>
              </div>
              <p className="text-text-secondary text-sm mb-6">用心规划每一次旅行，让回忆成为永恒</p>
              <div className="flex items-center justify-center gap-6 text-text-muted text-sm mb-8 flex-wrap">
                <span className="flex items-center gap-1.5">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                  12个目的地
                </span>
                <span className="w-1 h-1 rounded-full bg-text-muted" />
                <span className="flex items-center gap-1.5">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /></svg>
                  {totalDays}天总行程
                </span>
                <span className="w-1 h-1 rounded-full bg-text-muted" />
                <span>¥{(totalMin / 10000).toFixed(0)}-{(totalMax / 10000).toFixed(0)}万总预算</span>
              </div>
              <div className="flex items-center justify-center gap-3 mb-4">
                <div className="w-12 h-px bg-gradient-to-r from-transparent to-accent-cyan/50" />
                <div className="w-2 h-2 rounded-full bg-accent-cyan/60" />
                <div className="w-12 h-px bg-gradient-to-l from-transparent to-accent-purple/50" />
              </div>
              <p className="text-text-muted text-xs">Wanderlust Travel Plan &copy; 2025. All dreams reserved.</p>
            </div>
          </div>
        </footer>
      );
    }

    // --- App ---
    function App() {
      return (
        <div className="min-h-screen bg-bg-primary text-text-primary overflow-x-hidden">
          <Header />

          <div className="max-w-7xl mx-auto px-4">
            <div className="h-px bg-gradient-to-r from-transparent via-border to-transparent" />
          </div>

          {/* Destinations */}
          <section className="py-20 md:py-28">
            <div className="max-w-6xl mx-auto px-4">
              <div className="reveal text-center mb-16 md:mb-20">
                <span className="text-accent-purple text-sm tracking-[0.2em] uppercase">12 Destinations</span>
                <h2 className="text-3xl md:text-5xl font-bold mt-2 mb-4" style={{ fontFamily: 'var(--font-display)' }}>
                  梦想<span className="gradient-text">目的地</span>
                </h2>
                <p className="text-text-secondary max-w-xl mx-auto">
                  从首尔的雪夜到冰岛的极光，从日本的樱花到加拿大的枫红，每一处都是人生必去的风景
                </p>
              </div>

              <div className="space-y-24 md:space-y-32">
                {destinations.map((dest, index) => (
                  <DestinationCard key={dest.id} destination={dest} index={index} />
                ))}
              </div>
            </div>
          </section>

          <div className="max-w-7xl mx-auto px-4">
            <div className="h-px bg-gradient-to-r from-transparent via-border to-transparent" />
          </div>

          <Timeline />

          <div className="max-w-7xl mx-auto px-4">
            <div className="h-px bg-gradient-to-r from-transparent via-border to-transparent" />
          </div>

          <BudgetChart />

          <CTASection />

          <Footer />
        </div>
      );
    }

    // ========== MOUNT ==========
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Intersection Observer for reveal animations
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

      document.querySelectorAll('.reveal, .bar-grow').forEach(el => observer.observe(el));
    });
  </script>
</body>
</html>
